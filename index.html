<style>
:root{
  --bg:#EEF1FB; --surface:#FFFFFF; --surface-2:#E3E8F8; --ink:#151C3D; --muted:#555E82; --line:#D3D9EE;
  --brand:#2440E6; --brand-ink:#FFFFFF; --pop:#FF4F79; --good:#0F9E8E; --bad:#E8455F;
  --o0:#E8455F; --o1:#0F9E8E; --o2:#F2A900; --o3:#3B6CF2; --o2-ink:#2A1E00;
  --radius-lg:22px; --radius:14px; --radius-sm:9px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1430; --surface:#182046; --surface-2:#212B5A; --ink:#EEF0FF; --muted:#A5ACCF; --line:#2C3770;
    --brand:#7089FF; --brand-ink:#0F1430; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1430; --surface:#182046; --surface-2:#212B5A; --ink:#EEF0FF; --muted:#A5ACCF; --line:#2C3770;
  --brand:#7089FF; --brand-ink:#0F1430; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased; }
img{ max-width:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--brand); outline-offset:3px; }
.wrap{ max-width:1120px; margin:0 auto; padding:20px 20px 48px; }
.row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.spread{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.muted{ color:var(--muted); }
.small{ font-size:14px; }
h1,h2,h3{ margin:0; line-height:1.1; letter-spacing:-0.01em; }
h2{ font-size:28px; font-weight:800; }
h3{ font-size:20px; font-weight:600; }
p{ margin:0; }
.btn{ appearance:none; border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:10px 18px;
  font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:44px; color:var(--ink); }
.btn:hover{ border-color:var(--brand); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.btn-big{ font-size:20px; padding:14px 28px; min-height:56px; }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ border-color:var(--line); }
.btn-danger{ color:var(--bad); }
.icon{ width:22px; height:22px; flex:none; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:14px; font-weight:600; color:var(--muted); }
.input,select.input,textarea.input{ background:var(--surface); border:2px solid var(--line); border-radius:var(--radius-sm); padding:11px 13px; width:100%; min-height:46px; }
.input:focus{ border-color:var(--brand); outline:none; }
textarea.input{ resize:vertical; min-height:84px; }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:12px 20px; border-radius:999px; font-weight:600; z-index:50; max-width:90vw; text-align:center; }

/* top bar */
.topbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:28px; }
.mark{ font-weight:800; font-size:26px; letter-spacing:-0.03em; display:inline-flex; align-items:center; gap:4px; cursor:pointer; background:none; border:0; padding:0; }
.mark .dots{ display:inline-flex; gap:3px; margin-left:6px; }
.mark .dots i{ width:9px; height:9px; border-radius:50%; display:block; }

/* home */
.hero{ display:grid; grid-template-columns:1.2fr 1fr; gap:36px; align-items:center; padding:24px 0 36px; }
.hero h1{ font-size:clamp(56px, 10vw, 128px); font-weight:800; letter-spacing:-0.045em; line-height:.9; }
.hero .lede{ font-size:21px; max-width:30ch; margin-top:18px; color:var(--muted); }
.tiles-demo{ display:grid; grid-template-columns:1fr 1fr; gap:12px; transform:rotate(-3deg); }
.tiles-demo .opt{ min-height:96px; font-size:19px; }
.actions{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.action{ text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:var(--radius-lg); padding:22px; cursor:pointer; display:flex; flex-direction:column; gap:10px; min-height:170px; }
.action:hover{ border-color:var(--brand); }
.action b{ font-size:24px; font-weight:800; }
.action span{ color:var(--muted); }
.action .glyph{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; color:#fff; }
.status-note{ margin-top:18px; padding:14px 16px; border-radius:var(--radius); background:var(--surface-2); font-size:15px; }
.resume{ margin-top:18px; padding:16px 18px; border-radius:var(--radius); border:2px dashed var(--brand); display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }

/* options */
.opt{ position:relative; border:0; border-radius:var(--radius); color:#fff; font-weight:600; display:flex; align-items:center; gap:14px; padding:16px 18px; text-align:left; min-height:72px; font-size:21px; cursor:pointer; }
.opt .shape{ width:34px; height:34px; flex:none; }
.o0{ background:var(--o0); } .o1{ background:var(--o1); } .o2{ background:var(--o2); color:var(--o2-ink); } .o3{ background:var(--o3); }
.opt.dim{ opacity:.28; }
.opt .tick{ margin-left:auto; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.95); color:var(--good); display:grid; place-items:center; flex:none; }
.opt .count{ margin-left:auto; font-weight:800; font-size:26px; }

/* library */
.lib-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-top:20px; }
.card{ background:var(--surface); border:2px solid var(--line); border-radius:var(--radius-lg); padding:20px; display:flex; flex-direction:column; gap:10px; }
.card h3{ font-size:22px; }
.card .meta{ color:var(--muted); font-size:15px; }
.card .row{ margin-top:auto; padding-top:8px; }
.tag{ display:inline-block; font-size:13px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
.new-card{ border-style:dashed; justify-content:center; align-items:flex-start; cursor:pointer; min-height:170px; }

/* builder */
.builder{ display:grid; grid-template-columns:280px 1fr; gap:20px; margin-top:20px; align-items:start; }
.qlist{ display:flex; flex-direction:column; gap:8px; position:sticky; top:calc(12px + env(safe-area-inset-top,0px)); }
.qitem{ text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:var(--radius); padding:10px 12px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; }
.qitem.sel{ border-color:var(--brand); }
.qitem.err{ border-color:var(--bad); }
.qitem .n{ font-weight:800; color:var(--muted); min-width:22px; }
.qitem .t{ overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.editor{ min-width:0; background:var(--surface); border:2px solid var(--line); border-radius:var(--radius-lg); padding:22px; display:flex; flex-direction:column; gap:18px; }
.ans-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ans{ display:flex; align-items:center; gap:8px; border-radius:var(--radius); padding:8px 8px 8px 12px; color:#fff; }
.ans.o2{ color:var(--o2-ink); }
.ans input[type=text]{ flex:1; min-width:0; border:0; border-radius:8px; padding:10px; background:rgba(255,255,255,.92); color:#151C3D; min-height:44px; }
.ans .chk{ width:44px; height:44px; border-radius:50%; border:3px solid rgba(255,255,255,.9); background:transparent; cursor:pointer; display:grid; place-items:center; color:inherit; flex:none; }
.ans .chk[aria-pressed=true]{ background:#fff; color:var(--good); }
.ans .chk svg{ width:22px; height:22px; }
.ans .chk[aria-pressed=false] svg{ opacity:0; }
.img-prev{ position:relative; max-width:320px; }
.img-prev img{ border-radius:var(--radius); display:block; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }

/* host */
.host{ min-height:100vh; display:flex; flex-direction:column; }
.host-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 20px; }
.pinbox{ text-align:center; padding:10px 0 26px; }
.pinbox .how{ font-size:22px; color:var(--muted); }
.pin{ display:inline-flex; gap:10px; margin-top:12px; }
.pin span{ width:clamp(54px,8vw,92px); height:clamp(72px,10.5vw,120px); border-radius:18px; background:var(--surface); border:3px solid var(--ink); display:grid; place-items:center;
  font-size:clamp(44px,7vw,84px); font-weight:800; font-variant-numeric:tabular-nums; box-shadow:0 6px 0 var(--ink); }
.pin span:nth-child(3){ margin-right:14px; }
.lobby{ flex:1; padding:0 20px 24px; }
.lobby-bar{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.count-pill{ font-weight:800; font-size:22px; }
.chips{ display:flex; flex-wrap:wrap; gap:10px; }
.chip{ background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:8px 16px; font-weight:600; font-size:20px; cursor:pointer; }
.chip:hover{ border-color:var(--bad); text-decoration:line-through; }
.chip.off{ opacity:.45; }
.team-cols{ display:grid; gap:14px; }
.team-col{ border-radius:var(--radius-lg); padding:14px; background:var(--surface); border:2px solid var(--line); }
.team-col h3{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.team-col .chips{ gap:6px; } .team-col .chip{ font-size:16px; padding:6px 12px; }
.empty-lobby{ text-align:center; padding:40px 20px; color:var(--muted); font-size:20px; }
.stage{ flex:1; display:flex; flex-direction:column; padding:8px 20px 20px; gap:16px; }
.qtext{ background:var(--surface); border-radius:var(--radius-lg); padding:18px 24px; text-align:center; font-size:clamp(24px,3.4vw,44px); font-weight:800; line-height:1.15; border:2px solid var(--line); }
.mid{ flex:1; display:grid; grid-template-columns:140px 1fr 140px; align-items:center; gap:16px; min-height:180px; }
.mid .media{ display:grid; place-items:center; min-height:0; height:100%; }
.mid .media img{ max-height:40vh; border-radius:var(--radius-lg); }
.ring{ position:relative; width:128px; height:128px; }
.ring svg{ transform:rotate(-90deg); }
.ring .num{ position:absolute; inset:0; display:grid; place-items:center; font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; }
.answered{ text-align:center; }
.answered b{ display:block; font-size:54px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.optgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.optgrid .opt{ min-height:92px; font-size:clamp(20px,2.3vw,30px); cursor:default; }
.bars{ display:flex; align-items:flex-end; justify-content:center; gap:16px; height:100%; min-height:160px; }
.bars .bar{ width:70px; border-radius:12px 12px 4px 4px; display:flex; flex-direction:column; justify-content:flex-start; align-items:center; color:#fff; font-weight:800; font-size:22px; padding-top:6px; min-height:40px; transition:height .5s ease; }
.bars .bar.o2{ color:var(--o2-ink); }
.ready-screen{ flex:1; display:grid; place-items:center; text-align:center; gap:16px; padding:20px; }
.ready-screen .qn{ font-size:22px; color:var(--muted); font-weight:600; }
.ready-screen .big{ font-size:clamp(30px,4.6vw,58px); font-weight:800; max-width:24ch; line-height:1.1; }
.ready-bar{ width:min(520px,80vw); height:12px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin:0 auto; }
.ready-bar i{ display:block; height:100%; background:var(--brand); width:0; animation:fill 3s linear forwards; }
@keyframes fill{ to{ width:100%; } }
.board{ max-width:860px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
.lb-row{ display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:14px; background:var(--surface); border-radius:var(--radius); padding:12px 18px; border:2px solid var(--line); font-size:24px; font-weight:600; }
.lb-row .rk{ font-weight:800; color:var(--muted); }
.lb-row .sc{ font-weight:800; font-variant-numeric:tabular-nums; }
.lb-row .up{ font-size:15px; color:var(--good); font-weight:600; margin-left:10px; }
.lb-row.first{ border-color:var(--brand); }
.team-row{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; padding:12px 18px; border-radius:var(--radius); color:#fff; font-size:24px; font-weight:800; }
.team-row.o2{ color:var(--o2-ink); }
.team-row .shape{ width:30px; height:30px; }
.podium{ flex:1; display:flex; align-items:flex-end; justify-content:center; gap:14px; padding:20px 0 0; min-height:380px; }
.pod{ width:min(220px,28vw); display:flex; flex-direction:column; align-items:center; gap:8px; }
.pod .who{ font-size:clamp(20px,2.6vw,30px); font-weight:800; text-align:center; overflow-wrap:anywhere; }
.pod .pts{ color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
.pod .block{ width:100%; border-radius:16px 16px 0 0; display:grid; place-items:start center; padding-top:14px; font-size:56px; font-weight:800; color:#fff; transform-origin:bottom; }
.pod.p1 .block{ height:240px; background:var(--o2); color:var(--o2-ink); }
.pod.p2 .block{ height:170px; background:var(--o3); }
.pod.p3 .block{ height:120px; background:var(--o0); }
.pod.reveal{ animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both; }
.pod.p3.reveal{ animation-delay:.2s; } .pod.p2.reveal{ animation-delay:1s; } .pod.p1.reveal{ animation-delay:2s; }
@keyframes rise{ from{ transform:translateY(60px) scaleY(.2); opacity:0; } to{ transform:none; opacity:1; } }
.host-foot{ display:flex; justify-content:flex-end; gap:12px; padding:0 20px 20px; flex-wrap:wrap; }

/* player */
.player{ min-height:100vh; display:flex; flex-direction:column; }
.pbar{ color:var(--ink); display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--surface); border-bottom:2px solid var(--line); font-weight:600; gap:10px; }
.pbar .sc{ background:var(--ink); color:var(--bg); border-radius:999px; padding:4px 14px; font-variant-numeric:tabular-nums; }
.pmain{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:24px; gap:14px; }
.pmain h2{ font-size:34px; }
.pmain .huge{ font-size:64px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.pgrid{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
.pgrid.two{ grid-template-rows:1fr; }
.pgrid .opt{ flex-direction:column; justify-content:center; text-align:center; font-size:19px; min-height:120px; padding:12px; }
.pgrid .opt .shape{ width:56px; height:56px; }
.pgrid .opt .lbl{ max-width:100%; overflow-wrap:anywhere; }
.pgrid.two .opt{ font-size:26px; }
.pq{ padding:12px 16px 0; text-align:center; font-weight:600; font-size:18px; }
.ptimer{ font-variant-numeric:tabular-nums; }
.state-good{ background:var(--good); color:#fff; } .state-bad{ background:var(--bad); color:#fff; } .state-wait{ background:var(--brand); color:var(--brand-ink); }
.state-good .muted,.state-bad .muted,.state-wait .muted{ color:inherit; opacity:.85; }
.lock-shape{ width:96px; height:96px; border-radius:24px; display:grid; place-items:center; }
.lock-shape svg{ width:60px; height:60px; }
.join-card{ max-width:420px; margin:0 auto; background:var(--surface); border:2px solid var(--line); border-radius:var(--radius-lg); padding:24px; display:flex; flex-direction:column; gap:16px; }
.pin-input{ font-size:34px; font-weight:800; text-align:center; letter-spacing:.18em; font-variant-numeric:tabular-nums; }
.team-pick{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:420px; }
.team-pick .opt{ justify-content:center; font-size:20px; }
.team-pick .opt[aria-pressed=true]{ outline:4px solid var(--ink); outline-offset:3px; }

/* solo */
.solo-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.solo-grid .opt{ cursor:pointer; }
.solo-grid .opt:disabled{ cursor:default; }
.result-big{ text-align:center; padding:30px 0; display:flex; flex-direction:column; gap:12px; align-items:center; }
.result-big .huge{ font-size:80px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }

@media (max-width:860px){
  .hero{ grid-template-columns:1fr; gap:24px; }
  .tiles-demo{ transform:none; }
  .actions{ grid-template-columns:1fr; }
  .action{ min-height:0; }
  .builder{ grid-template-columns:1fr; }
  .qlist{ position:static; flex-direction:row; overflow-x:auto; padding-bottom:4px; }
  .qitem{ min-width:170px; }
  .mid{ grid-template-columns:96px 1fr 96px; }
  .ring{ width:92px; height:92px; } .ring svg{ width:92px; height:92px; } .ring .num{ font-size:32px; }
  .answered b{ font-size:38px; }
  .grid3{ grid-template-columns:1fr; }
}
@media (max-width:560px){
  .ans-grid,.optgrid{ grid-template-columns:1fr; }
  .bars .bar{ width:48px; }
  .lb-row{ font-size:19px; } .team-row{ font-size:19px; }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  .ready-bar i{ width:100%; }
}

.lobby-top{ display:flex; justify-content:center; align-items:center; gap:40px; flex-wrap:wrap; padding:0 20px; }
.lobby-top .pinbox{ padding-bottom:20px; }
.qr{ background:#fff; color:#151C3D; padding:12px; border-radius:18px; width:170px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:14px; font-weight:600; }
.qr svg{ width:146px; height:146px; display:block; }
ol.steps{ margin:18px 0 0; padding-left:22px; display:flex; flex-direction:column; gap:8px; max-width:70ch; }
pre.rules{ background:var(--surface); border:2px solid var(--line); border-radius:var(--radius); padding:14px; overflow-x:auto; font-size:13px; line-height:1.5; margin-top:10px; }
</style>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cut = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const ALPH = 'abcdefghijkmnpqrstuvwxyz23456789';
const rid = (n = 8) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => ALPH[b % 32]).join('');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const fmt = n => Number(n || 0).toLocaleString();
const clone = o => JSON.parse(JSON.stringify(o));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

let toastTimer = null;

/* ---------- Firebase connection ---------- */
const CFG = window.QUIZPOP_FIREBASE || {};
const configured = !!(CFG.apiKey && !/PASTE/i.test(CFG.apiKey) && CFG.databaseURL && !/PASTE/i.test(CFG.databaseURL));
let FB = null, UID = null, netStatus = 'pending', netErr = '';
async function initFB(){
  if (!configured){ netStatus = 'setup'; rerenderIf(['home','join']); return; }
  if (!window.firebase || !firebase.database){ netStatus = 'none'; netErr = 'The game server script didn’t load.'; rerenderIf(['home','join']); return; }
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('Timed out reaching the game server.')), 15000));
  try {
    firebase.initializeApp(CFG);
    await Promise.race([firebase.auth().signInAnonymously(), timeout]);
    UID = firebase.auth().currentUser.uid;
    FB = firebase.database();
    netStatus = 'ready';
  } catch (e){
    netStatus = 'none';
    netErr = e && e.code === 'auth/operation-not-allowed' ? 'Anonymous sign-in is turned off in your Firebase project (see setup step 3).' : (e && e.message) || 'Unknown error.';
  }
  rerenderIf(['home','join']);
}
function onConnected(cb){ const r = FB.ref('.info/connected'); const f = r.on('value', s => { if (s.val() === true) cb(); }); return () => r.off('value', f); }

/* ---------- quiz storage (this browser) ---------- */
const Store = {
  mine: [],
  load(){ this.mine = lsGet('qp.quizzes', []); },
  all(){ return [...this.mine, ...SAMPLES]; },
  get(id){ return this.all().find(q => q.id === id); },
  save(q){
    q.updated = Date.now();
    const body = clone(q); delete body.sample;
    const list = lsGet('qp.quizzes', []).filter(x => x.id !== q.id); list.unshift(body);
    if (!lsSet('qp.quizzes', list)) throw new Error('storage');
    this.mine = list;
  },
  remove(id){ const list = lsGet('qp.quizzes', []).filter(x => x.id !== id); lsSet('qp.quizzes', list); this.mine = list; }
};
function saveFile(filename, data, type){
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function normalizeQuiz(d){
  if (!d || !Array.isArray(d.questions) || !d.questions.length) throw new Error('bad');
  return {
    id: String(d.id || ''), title: cut(d.title || 'Imported quiz', 80), desc: cut(d.desc || '', 160),
    questions: d.questions.slice(0, 100).map(x => {
      const kind = x.kind === 'tf' ? 'tf' : 'mc';
      const opts = kind === 'tf' ? ['True','False'] : (Array.isArray(x.opts) ? x.opts.slice(0, 4).map(o => cut(o, 75)) : ['', '', '', '']);
      while (kind === 'mc' && opts.length < 4) opts.push('');
      const ok = (Array.isArray(x.ok) ? x.ok : [x.ok]).filter(i => Number.isInteger(i) && i >= 0 && i < opts.length);
      return { kind, text: cut(x.text || '', 200), opts, ok, lim: clamp(Number(x.lim) || 20, 5, 240), pts: [0, 1, 2].includes(x.pts) ? x.pts : 1,
        img: typeof x.img === 'string' && x.img.startsWith('data:image/') ? x.img : null };
    })
  };
}

let B = null;
function openBuilder(quiz, isNew){ B = { quiz, sel: 0, isNew, errs: new Set() }; go('builder'); }
const LIMITS = [5, 10, 15, 20, 30, 45, 60, 90, 120];
function validate(q){
  const errs = new Set();
  q.questions.forEach((x, i) => {
    const filled = x.opts.map((o, j) => o.trim() ? j : -1).filter(j => j >= 0);
    if (!x.text.trim() || filled.length < 2 || !x.ok.some(j => filled.includes(j))) errs.add(i);
  });
  return errs;
}

CHG.img = async el => {
  const f = el.files && el.files[0]; if (!f) return;
  try { curQ().img = await shrinkImage(f, 720, 0.72); render(); } catch { toast('That image couldn’t be read. Try a JPG or PNG.'); }

function shrinkImage(file, max, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };

/* ---------- SCORING ---------- */
function scoreFor(q, ms, streak){
  if (!q.pts) return 0;
  const base = Math.round(1000 * (1 - clamp(ms / (q.lim * 1000), 0, 1) / 2)) * q.pts;
  const bonus = streak >= 2 ? Math.min(500, (streak - 1) * 100) : 0;
  return base + bonus;
}

/* ---------- HOST ---------- */
let H = null;
const MAX_PLAYERS = 90;
let hostSetupQuiz = null, setupMode = 'classic', setupTeams = 2;

async function claimPin(){
  for (let i = 0; i < 6; i++){
    const pin = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
    const ref = FB.ref('games/' + pin);
    try { await ref.child('host').set(UID); return { pin, ref }; }
    catch (e){ if (!/permission/i.test((e && (e.code || e.message)) || '')) throw e; }
  }
  throw new Error('Couldn’t find a free PIN.');
}
async function hostStart(saved, fresh){
  let ref, pin = saved.pin;
  try {
    if (fresh){ const c = await claimPin(); pin = c.pin; ref = c.ref; }
    else {
      ref = FB.ref('games/' + pin);
      const h = await ref.child('host').once('value');
      if (h.val() !== UID){ toast('That game can’t be resumed from this browser.'); lsDel('qp.host'); render(); return false; }
    }
    await ref.child('meta').set({ title: cut(saved.quiz.title, 80), created: Date.now() });
  } catch (e){
    toast(/permission/i.test(String(e && (e.code || e.message))) ? 'The game server refused the request. Check the database rules (setup step 4).' : 'Couldn’t open a game. Check the connection and try again.');
    return false;
  }
  H = {
    pin, ref, quiz: saved.quiz, mode: saved.mode, teamCount: saved.teamCount || 2,
    since: Date.now(), phase: saved.phase, qi: saved.qi, qid: null, qStart: 0,
    players: new Map((saved.players || []).map(p => [p.pid, { ...p, online: false }])),
    ban: new Set(saved.ban || []), answers: new Map(), dist: [0,0,0,0], timers: [], tick: null, prevRanks: new Map()
  };
  H.offConn = onConnected(() => { if (!H) return; ref.child('hostOn').onDisconnect().set(false); ref.child('hostOn').set(true); });
  H.playersCb = ref.child('players').on('value', snap => hostPlayers(snap.val() || {}));
  view = 'host'; render();
  if (saved.phase === 'ready' || saved.phase === 'question'){ H.phase = 'board'; H.qi = saved.qi - 1; setTimeout(() => hostNext(), 1500); }
  else if (saved.phase === 'reveal'){ H.phase = 'board'; }
  pushState(); saveHost();
  return true;
}
ACT.resumeHost = async el => {
  const s = lsGet('qp.host', null); if (!s || !needNet()) return;

};
ACT.discardResume = () => {

};
function saveHost(){
  if (!H) return;
  lsSet('qp.host', { pin: H.pin, quiz: H.quiz, mode: H.mode, teamCount: H.teamCount, phase: H.phase, qi: H.qi,
    players: [...H.players.values()].map(({ online, ...p }) => p), ban: [...H.ban], savedAt: Date.now() });
}
function endHosting(close){
  if (!H) return;
  const h = H; H = null;
  h.timers.forEach(clearTimeout); clearInterval(h.tick);
  try { h.ref.child('players').off('value', h.playersCb); } catch {}
  try { h.offConn && h.offConn(); } catch {}
  if (close){
    h.ref.child('hostOn').onDisconnect().cancel().catch(() => {});
    h.ref.child('state').set({ v: 1, since: h.since, phase: 'closed' }).catch(() => {});
    setTimeout(() => h.ref.remove().catch(() => {}), 5000);
    lsDel('qp.host');
  }
}
function hostPlayers(obj){
  if (!H) return;
  const q = H.quiz.questions[H.qi];
  const online = new Set();
  let changed = false, answered = false;
  for (const [pid, pr] of Object.entries(obj)){
    if (!pr || typeof pr !== 'object' || H.ban.has(pid)) continue;
    if (pr.on !== false) online.add(pid);
    let pl = H.players.get(pid);
    const name = cut(String(pr.name || 'Player').replace(/\s+/g, ' ').trim() || 'Player', 20);
    const team = H.mode === 'teams' && Number.isInteger(pr.team) && pr.team >= 0 && pr.team < H.teamCount ? pr.team : -1;
    if (!pl){
      if (H.players.size >= MAX_PLAYERS) continue;
      pl = { pid, name, team, score: 0, streak: 0, lastPts: 0, ok: -1, correct: 0, online: pr.on !== false };
      H.players.set(pid, pl); changed = true;
    } else if (pl.name !== name || (team !== -1 && pl.team !== team)){
      pl.name = name; if (team !== -1) pl.team = team; changed = true;
    }
    const a = pr.ans;
    if (H.phase === 'question' && q && a && a.q === H.qid && !H.answers.has(pid) && Number.isInteger(a.c) && a.c >= 0 && a.c < q.opts.length){
      H.answers.set(pid, { c: a.c, ms: clamp(Number(a.ms) || q.lim * 1000, 0, q.lim * 1000) });
      answered = true;
    }
  }
  for (const pl of H.players.values()){ const on = online.has(pl.pid); if (pl.online !== on){ pl.online = on; changed = true; } }
  if (changed){ if (H.phase === 'lobby'){ pushState(); render(); } }
  if (answered || changed){
    updateAnsweredCount();
    if (H.phase === 'question'){
      const live = [...H.players.values()].filter(p => p.online).length;
      if (live > 0 && H.answers.size >= live) endQuestion();
    }
  }
}
function ranked(){
  const list = [...H.players.values()].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  let r = 0, prev = null;
  list.forEach((p, i) => { if (p.score !== prev){ r = i + 1; prev = p.score; } p.rank = r; });
  return list;
}
function teamScores(){
  const t = Array.from({ length: H.teamCount }, (_, i) => ({ i, name: TEAM_NAMES[i], total: 0, n: 0 }));
  for (const p of H.players.values()){ if (p.team >= 0 && p.team < H.teamCount){ t[p.team].total += p.score; t[p.team].n++; } }
  t.forEach(x => { x.avg = x.n ? Math.round(x.total / x.n) : 0; });
  return t;
}
function pushState(){
  if (!H) return;
  const q = H.quiz.questions[H.qi];
  const s = { v: 1, since: H.since, mode: H.mode, phase: H.phase, qi: H.qi, qn: H.quiz.questions.length, qid: H.qid || '', title: cut(H.quiz.title, 60) };
  if (H.mode === 'teams'){ s.tc = H.teamCount; s.ts = teamScores().map(t => t.avg); }
  if (q && H.phase !== 'lobby' && H.phase !== 'final'){ s.lim = q.lim; s.kind = q.kind; s.nopt = q.opts.length; s.m = q.opts.map(o => o ? 1 : 0); }
  if (q && (H.phase === 'question' || H.phase === 'reveal')){ s.q = cut(q.text, 200); s.o = q.opts.map(o => o || ''); }
  if (q && H.phase === 'reveal') s.ok = q.ok;
  const sc = {};
  for (const p of ranked()) sc[p.pid] = [p.score, p.rank, p.lastPts, p.ok, p.streak, p.team];
  s.sc = sc;
  if (H.ban.size) s.ban = [...H.ban];
  H.ref.child('state').set(clone(s)).catch(() => toast('Lost contact with the game server. Retrying…'));
}
function updateAnsweredCount(){
  const el = document.getElementById('ansCount'); if (el && H) el.textContent = H.answers.size;
  const tl = document.getElementById('ansOf'); if (tl && H) tl.textContent = 'of ' + [...H.players.values()].filter(p => p.online).length + ' answered';
}
ACT.kick = el => {

ACT.hostStartGame = () => {
  if (!H || !H.players.size) return;
  if (H.mode === 'teams'){
    for (const p of H.players.values()){ if (p.team < 0){ p.team = teamScores().sort((a, b) => a.n - b.n)[0].i; } }
  }
  H.qi = -1; hostNext();
};
function hostNext(){
  if (!H) return;
  H.timers.forEach(clearTimeout); H.timers = [];
  if (H.qi + 1 >= H.quiz.questions.length){ H.phase = 'final'; pushState(); saveHost(); render(); return; }
  H.qi++; H.qid = H.qi + '-' + rid(4); H.phase = 'ready'; H.answers = new Map();
  pushState(); saveHost(); render();
  H.timers.push(setTimeout(() => startQuestion(), 3000));
}
function startQuestion(){
  if (!H) return;
  const q = H.quiz.questions[H.qi];
  H.phase = 'question'; H.qStart = performance.now();
  pushState(); render();
  H.timers.push(setTimeout(() => endQuestion(), q.lim * 1000 + 1500));
}
function endQuestion(){
  if (!H || H.phase !== 'question') return;
  H.timers.forEach(clearTimeout); H.timers = []; clearInterval(H.tick);
  const q = H.quiz.questions[H.qi];
  H.prevRanks = new Map(ranked().map(p => [p.pid, p.rank]));
  H.dist = q.opts.map(() => 0);
  for (const pl of H.players.values()){
    const a = H.answers.get(pl.pid);
    if (!a){ pl.ok = -1; pl.lastPts = 0; if (q.pts) pl.streak = 0; continue; }
    H.dist[a.c]++;
    if (q.ok.includes(a.c)){ pl.streak++; pl.lastPts = scoreFor(q, a.ms, pl.streak); pl.score += pl.lastPts; pl.ok = 1; pl.correct++; }
    else { pl.ok = 0; pl.lastPts = 0; if (q.pts) pl.streak = 0; }
  }
  H.phase = 'reveal'; pushState(); saveHost(); render();
}

function ringSvg(){

}
function hostAfterRender(){

    const q = H.quiz.questions[H.qi]; const C = 2 * Math.PI * 44;
    const upd = () => {

      const n = document.getElementById('ringNum'), a = document.getElementById('ringArc');

}

    return `<div class="host">${top}<div class="stage"><div class="board">
      <div class="spread"><h2>${H.mode === 'teams' ? 'Team standings' : 'Leaderboard'}</h2><span class="muted">After question ${H.qi + 1} of ${H.quiz.questions.length}</span></div>
      ${teams}${H.mode === 'teams' ? '<h3 style="margin-top:14px">Top players</h3>' : ''}
      ${rows || '<p class="muted">No scores yet.</p>'}
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-primary btn-big" data-act="hostNext">${last ? 'Show the winners' : 'Next question'}</button></div>
    </div></div></div>`;
  }

  if (H.phase === 'final'){
    const list = ranked();
    const pod = (p, k) => p ? `<div class="pod p${k} reveal"><span class="who">${esc(p.name)}</span><span class="pts">${fmt(p.score)} pts · ${p.correct}/${H.quiz.questions.length}</span><div class="block">${k}</div></div>` : `<div class="pod p${k}"></div>`;
    let teamBanner = '';
    if (H.mode === 'teams'){
      const ts = teamScores().sort((a, b) => b.avg - a.avg);
      teamBanner = `<div class="team-row o${ts[0].i}" style="max-width:860px;margin:0 auto;width:100%">${shape(ts[0].i)}<span>${ts[0].name} win the game</span><span>${fmt(ts[0].avg)}</span></div>`;
    }
    return `<div class="host">${top}<div class="stage">
      <h2 style="text-align:center;font-size:clamp(32px,5vw,60px)">${esc(H.quiz.title)}</h2>
      ${teamBanner}
      <div class="podium">${pod(list[1], 2)}${pod(list[0], 1)}${pod(list[2], 3)}</div></div>
      <div class="host-foot"><button class="btn" data-act="hostCsv">Download results (CSV)</button><button class="btn" data-act="hostAgain">Play again with the same players</button><button class="btn btn-primary" data-act="hostEnd">Finish</button></div></div>`;
  }
  return '';
};

/* ---------- PLAYER ---------- */
let P = null;
ACT.join = () => go('join');
RENDER.join = pin => {
  const blocked = netStatus === 'setup' || netStatus === 'none';
  return `<div class="wrap">
    <div class="topbar">${wordmark()}<button class="btn btn-ghost" data-act="home">Back</button></div>
    <div class="join-card">
      <h2>Join a game</h2>
      ${netStatus === 'setup' ? `<p class="muted">This copy of QuizPop isn’t connected to a game server yet. Ask the host for their link.</p>` : ''}
      ${netStatus === 'none' ? `<p class="muted">Can’t reach the game server. Check your internet connection and reload.</p>` : ''}
      <div class="field"><label for="jpin">Game PIN</label><input id="jpin" class="input pin-input" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000" value="${esc(pin || '')}" data-enter="joinGo" data-in="pinOnly" ${blocked ? 'disabled' : pin ? '' : 'data-autofocus'}></div>
      <div class="field"><label for="jname">Nickname</label><input id="jname" class="input" maxlength="20" autocomplete="nickname" placeholder="What should the screen call you?" value="${esc(lsGet('qp.name', ''))}" data-enter="joinGo" ${blocked ? 'disabled' : pin ? 'data-autofocus' : ''}></div>
      <button class="btn btn-primary btn-big" data-act="joinGo" style="justify-content:center" ${blocked ? 'disabled' : ''}>Join</button>
      <p class="muted small" id="joinMsg" role="status">${netStatus === 'pending' ? 'Connecting to the game server…' : ''}</p>
    </div></div>`;
};
INP.pinOnly = el => { el.value = el.value.replace(/\D/g, '').slice(0, 6); };
ACT.joinGo = async () => {
  const pinEl = document.getElementById('jpin'), nameEl = document.getElementById('jname'), msg = document.getElementById('joinMsg');
  const btn = app.querySelector('[data-act="joinGo"]');
  const pin = (pinEl.value || '').replace(/\D/g, ''); const name = cut((nameEl.value || '').replace(/\s+/g, ' ').trim(), 20);
  if (pin.length !== 6){ msg.textContent = 'Enter the 6-digit PIN shown on the host’s screen.'; pinEl.focus(); return; }
  if (!name){ msg.textContent = 'Enter a nickname so the host can see you.'; nameEl.focus(); return; }
  if (netStatus !== 'ready'){ msg.textContent = netStatus === 'pending' ? 'Still connecting — try again in a moment.' : 'Can’t reach the game server. Check your connection and reload.'; return; }
  btn.disabled = true; msg.textContent = 'Looking for the game…';
  lsSet('qp.name', name);
  const ref = FB.ref('games/' + pin);
  try {
    const [hs, st] = await Promise.all([ref.child('host').once('value'), ref.child('state').once('value')]);
    if (!hs.exists()){ btn.disabled = false; msg.textContent = 'No game found with PIN ' + pin + '. Check the number on the big screen.'; return; }
    const s = st.val();
    if (s && s.phase === 'closed'){ btn.disabled = false; msg.textContent = 'That game has ended.'; return; }
    if (s && s.ban && Object.values(s.ban).includes(UID)){ btn.disabled = false; msg.textContent = 'The host removed you from this game.'; return; }
    const me = ref.child('players/' + UID);
    const old = (await me.once('value')).val();
    await me.update({ name, on: true, team: old && Number.isInteger(old.team) ? old.team : -1 });
    P = { pin, pid: UID, name, team: old && Number.isInteger(old.team) ? old.team : -1, ref, me, s: null, seenQid: null, qSeenAt: 0, myAns: null, hostOn: true, tick: null };
    P.offConn = onConnected(() => { if (!P) return; me.onDisconnect().update({ on: false }); me.update({ on: true }).catch(() => {}); });
    P.stateCb = ref.child('state').on('value', snap => playerState(snap.val()));
    P.hostCb = ref.child('hostOn').on('value', snap => {
      if (!P) return; const on = snap.val() !== false;
      if (on !== P.hostOn){ P.hostOn = on; if (!on) P.hostOffAt = Date.now(); setTimeout(() => { if (P && view === 'player') render(); }, on ? 0 : 3500); }
    });
    history.replaceState(null, '', pageUrl());
  } catch (e){
    btn.disabled = false; msg.textContent = 'Couldn’t join. Check your connection and try again.';
  }
};
function leavePlayer(remove = true){
  if (!P) return;
  const p = P; P = null;
  clearInterval(p.tick);
  try { p.ref.child('state').off('value', p.stateCb); p.ref.child('hostOn').off('value', p.hostCb); } catch {}
  try { p.offConn && p.offConn(); } catch {}
  p.me.onDisconnect().cancel().catch(() => {});
  if (remove) p.me.update({ on: false }).catch(() => {});
}
function playerState(s){
  if (!P) return;
  const prev = P.s;
  if (!s){ s = { phase: 'closed' }; }
  P.s = s;
  if (s.sc && s.sc[P.pid]) P.lastScore = s.sc[P.pid][0];
  if (s.ban && Object.values(s.ban).includes(P.pid)) P.kicked = true;
  if (s.phase === 'question' && s.qid !== P.seenQid){ P.seenQid = s.qid; P.qSeenAt = performance.now(); P.myAns = null; }
  const key = x => x ? [x.phase, x.qid, x.mode, x.tc, JSON.stringify(x.sc && x.sc[P.pid]), JSON.stringify(x.ok), x.phase === 'lobby' ? Object.keys(x.sc || {}).length : 0, P.kicked].join('|') : '';
  if (view !== 'player') go('player');
  else if (key(prev) !== key(s)) render();
}
ACT.pickTeam = el => { if (!P) return; P.team = +el.dataset.t; P.me.update({ team: P.team }).catch(() => {}); render(); };
ACT.answer = el => {
  if (!P || !P.s || P.s.phase !== 'question' || P.myAns != null) return;
  const c = +el.dataset.c; const ms = Math.round(performance.now() - P.qSeenAt);
  P.myAns = c;
  P.me.update({ ans: { q: P.s.qid, c, ms } }).catch(() => toast('Your answer didn’t send. Check your connection.'));
  if (navigator.vibrate) try { navigator.vibrate(30); } catch {}
  render();
};
ACT.playerLeave = () => { leavePlayer(); go('home'); };
const arr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.values(x) : []);
RENDER.player = () => {
  if (!P) return RENDER.join();
  const s = P.s || {};
  const me = s.sc && s.sc[P.pid];
  const myScore = me ? me[0] : (P.lastScore || 0);
  const bar = `<div class="pbar"><span>${esc(P.name)}</span><span class="row"><span class="sc">${fmt(myScore)}</span><button class="btn btn-ghost" data-act="playerLeave" style="min-height:36px;padding:4px 10px">Leave</button></span></div>`;
  const wrapState = (cls, inner) => `<div class="player ${cls}">${bar}<div class="pmain">${inner}</div></div>`;
  if (P.kicked) return wrapState('', `<h2>The host removed you from this game</h2><button class="btn btn-big" data-act="playerLeave">Back home</button>`);
  if (s.phase === 'closed') return wrapState('', `<h2>The host ended the game</h2><p class="muted">Thanks for playing.</p><button class="btn btn-big" data-act="playerLeave">Back home</button>`);
  if (!P.hostOn && Date.now() - (P.hostOffAt || 0) > 3000) return wrapState('', `<h2>Waiting for the host to reconnect…</h2><p class="muted">Keep this page open. Your score is saved.</p>`);

  if (!P.s || s.phase === 'lobby'){
    if (s.mode === 'teams'){
      const myTeam = me && me[5] >= 0 ? me[5] : P.team;
      return wrapState('', `<h2>${me ? 'You’re in!' : 'Joining…'}</h2><p class="muted">Pick your team</p>
        <div class="team-pick">${Array.from({ length: s.tc || 2 }, (_, i) => `<button class="opt o${i}" data-act="pickTeam" data-t="${i}" aria-pressed="${myTeam === i}">${shape(i)}${TEAM_NAMES[i]}</button>`).join('')}</div>
        <p class="muted small">Watch the big screen for your name.</p>`);
    }
    return wrapState('state-wait', `<h2>${me ? 'You’re in!' : 'Joining…'}</h2><p class="muted">Look for your name on the big screen. The game starts soon.</p>`);
  }
  if (s.phase === 'ready'){
    return wrapState('state-wait', `<p class="muted">Question ${(s.qi || 0) + 1} of ${s.qn}</p><h2>Get ready</h2><div class="ready-bar" style="background:rgba(255,255,255,.25)"><i style="background:currentColor"></i></div>`);
  }
  if (s.phase === 'question'){
    if (P.myAns != null){
      const c = s.kind === 'tf' ? (P.myAns === 0 ? 1 : 0) : P.myAns;
      return wrapState('state-wait', `<div class="lock-shape o${c}" style="color:${c === 2 ? 'var(--o2-ink)' : '#fff'}">${shape(c, '')}</div><h2>Answer locked in</h2><p class="muted">Waiting for everyone else…</p>`);
    }
    const n = s.nopt || 4, m = arr(s.m), o = arr(s.o);
    const tiles = Array.from({ length: n }, (_, j) => {
      if (m.length && !m[j]) return '';
      const c = s.kind === 'tf' ? (j === 0 ? 1 : 0) : j;
      const label = o[j] || (s.kind === 'tf' ? ['True','False'][j] : SHAPE_NAMES[c]);
      return `<button class="opt o${c}" data-act="answer" data-c="${j}">${shape(c)}<span class="lbl">${esc(label)}</span></button>`;
    }).join('');
    const shown = m.length ? m.filter(Boolean).length : n;
    clearInterval(P.tick);
    P.tick = setInterval(() => {
      const el = document.getElementById('ptimer'); if (!el || !P || !P.s || P.s.phase !== 'question') return;
      el.textContent = Math.max(0, Math.ceil(P.s.lim - (performance.now() - P.qSeenAt) / 1000));
    }, 250);
    return `<div class="player">${bar}<div class="pq">${s.q ? esc(s.q) : 'Question ' + ((s.qi || 0) + 1)} <span class="muted ptimer">· <span id="ptimer">${s.lim}</span>s</span></div><div class="pgrid ${shown === 2 ? 'two' : ''}">${tiles}</div></div>`;
  }
  if (s.phase === 'reveal'){
    if (!me) return wrapState('', `<h2>Hang tight</h2><p class="muted">You’ll play from the next question.</p>`);
    const [, rank, pts, ok, streak] = me;
    if (ok === 1) return wrapState('state-good', `<h2>Correct</h2><p class="huge">+${fmt(pts)}</p>${streak >= 2 ? `<p>Answer streak: ${streak}</p>` : ''}<p class="muted">You’re in ${ord(rank)} place</p>`);
    if (ok === 0) return wrapState('state-bad', `<h2>Not this time</h2><p class="muted">You’re in ${ord(rank)} place</p>`);
    return wrapState('state-bad', `<h2>Time’s up</h2><p class="muted">No answer this round. You’re in ${ord(rank)} place.</p>`);
  }
  if (s.phase === 'board'){
    if (!me) return wrapState('state-wait', `<h2>Look at the big screen</h2>`);
    const [score, rank] = me;
    let gap = '';
    if (rank > 1){ const ahead = Object.values(s.sc).filter(v => v[1] < rank).sort((a, b) => a[0] - b[0])[0]; if (ahead) gap = `<p class="muted">${fmt(ahead[0] - score)} points behind ${ord(ahead[1])} place</p>`; }
    const ts = arr(s.ts);
    const team = s.mode === 'teams' && me[5] >= 0 && ts.length ? `<p>${TEAM_NAMES[me[5]]}: ${fmt(ts[me[5]])} average</p>` : '';
    return wrapState('state-wait', `<p class="muted">You’re in</p><p class="huge">${ord(rank)}</p>${gap}${team}`);
  }
  if (s.phase === 'final'){
    if (!me) return wrapState('', `<h2>Game over</h2>`);
    const [score, rank] = me;
    const msg = rank === 1 ? 'You won!' : rank <= 3 ? 'You made the podium!' : 'Nice game!';
    return wrapState(rank <= 3 ? 'state-good' : 'state-wait', `<h2>${msg}</h2><p class="huge">${ord(rank)}</p><p>${fmt(score)} points</p><button class="btn btn-big" data-act="playerLeave" style="margin-top:18px">Back home</button>`);
  }
  return wrapState('state-wait', `<h2>Connected</h2><p class="muted">Waiting for the host…</p>`);
};

/* ---------- SOLO ---------- */
let S = null;
ACT.soloStart = el => { const q = Store.get(el.dataset.id); if (!q) return; S = { quiz: q, qi: -1, score: 0, correct: 0, streak: 0, phase: 'ready' }; soloNext(); };
function stopSolo(){ if (!S) return; clearTimeout(S.timer); clearInterval(S.tick); S = null; }
function soloNext(){
  clearTimeout(S.timer); clearInterval(S.tick);
  if (S.qi + 1 >= S.quiz.questions.length){
    S.phase = 'done';
    const best = lsGet('qp.best', {}); S.isBest = S.score > (best[S.quiz.id] || 0);
    if (S.isBest){ best[S.quiz.id] = S.score; lsSet('qp.best', best); }
    go('solo'); return;
  }
  S.qi++; S.phase = 'ready'; go('solo');
  S.timer = setTimeout(() => {
    if (!S) return; S.phase = 'question'; S.t0 = performance.now(); S.pick = null; render();
    const q = S.quiz.questions[S.qi], C = 2 * Math.PI * 44;
    S.tick = setInterval(() => {
      if (!S || S.phase !== 'question') return;
      const left = Math.max(0, q.lim * 1000 - (performance.now() - S.t0));
      const n = document.getElementById('ringNum'), a = document.getElementById('ringArc');
      if (n) n.textContent = Math.ceil(left / 1000); if (a) a.setAttribute('stroke-dashoffset', C * (1 - left / (q.lim * 1000)));
      if (left <= 0) soloReveal(null);
    }, 200);
  }, 2000);
}
function soloReveal(c){
  if (!S || S.phase !== 'question') return;
  clearInterval(S.tick);
  const q = S.quiz.questions[S.qi]; const ms = performance.now() - S.t0;
  S.pick = c; S.gained = 0;
  if (c != null && q.ok.includes(c)){ S.streak++; S.gained = scoreFor(q, ms, S.streak); S.score += S.gained; S.correct++; }
  else if (q.pts) S.streak = 0;
  S.phase = 'reveal'; render();
}
ACT.soloAnswer = el => soloReveal(+el.dataset.c);
ACT.soloNext = () => soloNext();
ACT.soloAgain = () => { const q = S.quiz; S = { quiz: q, qi: -1, score: 0, correct: 0, streak: 0, phase: 'ready' }; soloNext(); };
ACT.soloQuit = () => { stopSolo(); libPurpose = 'solo'; go('library'); };
RENDER.solo = () => {
  if (!S) return RENDER.home();
  const q = S.quiz.questions[S.qi], N = S.quiz.questions.length;
  const top = `<div class="topbar">${wordmark()}<button class="btn btn-ghost" data-act="soloQuit">Quit</button></div>`;
  if (S.phase === 'done'){
    return `<div class="wrap">${top}<div class="result-big"><p class="muted">${esc(S.quiz.title)}</p><p class="huge">${fmt(S.score)}</p>
      <p>${S.correct} of ${N} correct${S.isBest ? ' · New personal best' : ''}</p>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="soloQuit">Choose another quiz</button><button class="btn btn-primary btn-big" data-act="soloAgain">Play again</button></div></div></div>`;
  }
  const head = `<div class="solo-top"><span class="muted">Question ${S.qi + 1} of ${N}${q.pts === 2 ? ' · Double points' : q.pts === 0 ? ' · No points' : ''}</span><span><b>${fmt(S.score)}</b> points</span></div>`;
  if (S.phase === 'ready') return `<div class="wrap">${top}${head}<div class="ready-screen" style="min-height:50vh"><div><p class="big" style="margin-bottom:24px">${esc(q.text)}</p><div class="ready-bar"><i style="animation-duration:2s"></i></div></div></div></div>`;
  const rev = S.phase === 'reveal';
  const opts = q.opts.map((o, j) => {
    if (!o) return '';
    const c = q.kind === 'tf' ? (j === 0 ? 1 : 0) : j, right = q.ok.includes(j);
    return `<button class="opt o${c} ${rev && !right && S.pick !== j ? 'dim' : ''}" data-act="soloAnswer" data-c="${j}" ${rev ? 'disabled' : ''}>${shape(c)}<span>${esc(o)}</span>${rev && right ? `<span class="tick">${TICK}</span>` : ''}</button>`;
  }).join('');
  let verdict = '';
  if (rev){
    const ok = S.pick != null && q.ok.includes(S.pick);
    verdict = `<div class="spread" style="margin-top:16px;padding:16px 20px">
      <b style="font-size:24px;color:${ok ? 'var(--good)' : 'var(--bad)'}">${ok ? 'Correct · +' + fmt(S.gained) : S.pick == null ? 'Time’s up' : 'Not this time'}</b>
      <button class="btn btn-primary btn-big" data-act="soloNext" data-autofocus>${S.qi + 1 >= N ? 'See your score' : 'Next question'}</button></div>`;
  }
  return `<div class="wrap">${top}${head}
    <div class="qtext">${esc(q.text)}</div>
    <div class="mid" style="margin:16px 0">${rev ? '<div></div>' : `<div class="ring">${ringSvg()}<span class="num" id="ringNum">${q.lim}</span></div>`}<div class="media">${q.img ? `<img src="${esc(q.img)}" alt="">` : ''}</div><div></div></div>
    <div class="optgrid solo-grid">${opts}</div>${verdict}</div>`;
};

/* ---------- boot ---------- */
function route(){
  const m = location.hash.match(/^#join(?:-(\d{6}))?$/);
  if (m && !P && !H) go('join', m[1] || null);
}
Store.load();
render();
route();
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', () => { if (H) saveHost(); });
initFB();
})();

</script>
</body>
</html>
